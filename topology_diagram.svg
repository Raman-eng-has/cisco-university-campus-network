<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1020" width="100%" height="100%">
  <defs>
    <!-- Shadow filter for clean modern depth -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .node-box {
      fill: #1E293B;
      stroke: #475569;
      stroke-width: 2;
      rx: 10px;
      ry: 10px;
      filter: url(#boxShadow);
    }
    .node-box-core {
      fill: #1E293B;
      stroke: #38BDF8;
      stroke-width: 2.5;
      rx: 10px;
      ry: 10px;
      filter: url(#boxShadow);
    }
    .node-box-server {
      fill: #1E293B;
      stroke: #10B981;
      stroke-width: 2;
      rx: 10px;
      ry: 10px;
      filter: url(#boxShadow);
    }
    .title-text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #FFFFFF;
      text-anchor: middle;
    }
    .subtitle-text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #93C5FD;
      text-anchor: middle;
    }
    .connector-line {
      stroke: #64748B;
      stroke-width: 2.5;
      fill: none;
    }
    .redundant-line {
      stroke: #F59E0B;
      stroke-width: 2.5;
      stroke-dasharray: 6, 5;
      fill: none;
    }
    .label-pill {
      fill: #0F172A;
      stroke: #334155;
      stroke-width: 1.5;
      rx: 6px;
      ry: 6px;
    }
    .label-pill-stp {
      fill: #451A03;
      stroke: #F59E0B;
      stroke-width: 1.5;
      rx: 6px;
      ry: 6px;
    }
    .label-text {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #F1F5F9;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .label-text-stp {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #FDE68A;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- ================= CABLES / CONNECTOR LINES ================= -->
  <!-- 1. Internet Server to R-ISP -->
  <line x1="575" y1="90" x2="575" y2="175" class="connector-line"/>

  <!-- 2. R-ISP to R-CAMPUS -->
  <line x1="575" y1="245" x2="575" y2="330" class="connector-line"/>

  <!-- 3. R-CAMPUS to R-HOSTEL (L-line) -->
  <path d="M 480 400 L 480 440 L 220 440 L 220 500" class="connector-line"/>

  <!-- 4. R-HOSTEL to SW-HOSTEL -->
  <line x1="220" y1="570" x2="220" y2="675" class="connector-line"/>

  <!-- 5. SW-HOSTEL to AP-HOSTEL -->
  <line x1="220" y1="740" x2="220" y2="830" class="connector-line"/>

  <!-- 6. R-CAMPUS to SW-CORE (L-line) -->
  <path d="M 670 400 L 670 440 L 800 440 L 800 500" class="connector-line"/>

  <!-- 7. SW-CORE to SW-ADMIN (L-line) -->
  <path d="M 720 570 L 720 610 L 520 610 L 520 675" class="connector-line"/>

  <!-- 8. SW-CORE to SW-SERVER (L-line) -->
  <path d="M 880 570 L 880 610 L 980 610 L 980 675" class="connector-line"/>

  <!-- 9. SW-CORE to SW-ACADEMIC -->
  <path d="M 800 570 L 800 780 L 750 780 L 750 830" class="connector-line"/>

  <!-- 10. Redundant Link: SW-ADMIN to SW-ACADEMIC (Dashed STP Link) -->
  <path d="M 520 740 L 520 865 L 590 865" class="redundant-line"/>


  <!-- ================= LINK LABELS / PILLS ================= -->
  <!-- Label: Fa0 -->
  <rect x="545" y="120" width="60" height="26" class="label-pill"/>
  <text x="575" y="133" class="label-text">Fa0</text>

  <!-- Label: WAN 200.1.1.0/30 -->
  <rect x="495" y="275" width="160" height="26" class="label-pill"/>
  <text x="575" y="288" class="label-text">WAN 200.1.1.0/30</text>

  <!-- Label: WAN 10.0.0.4/30 (RIPv2) -->
  <rect x="135" y="427" width="170" height="26" class="label-pill"/>
  <text x="220" y="440" class="label-text">WAN 10.0.0.4/30 (RIPv2)</text>

  <!-- Label: 802.1Q Trunk (Campus to Core) -->
  <rect x="740" y="427" width="120" height="26" class="label-pill"/>
  <text x="800" y="440" class="label-text">802.1Q Trunk</text>

  <!-- Label: 802.1Q Trunk (Hostel) -->
  <rect x="160" y="610" width="120" height="26" class="label-pill"/>
  <text x="220" y="623" class="label-text">802.1Q Trunk</text>

  <!-- Label: Trunk 10,60,99 -->
  <rect x="455" y="597" width="130" height="26" class="label-pill"/>
  <text x="520" y="610" class="label-text">Trunk 10,60,99</text>

  <!-- Label: Trunk 70,99 -->
  <rect x="925" y="597" width="110" height="26" class="label-pill"/>
  <text x="980" y="610" class="label-text">Trunk 70,99</text>

  <!-- Label: Trunk 20,30,40,99 -->
  <rect x="715" y="735" width="150" height="26" class="label-pill"/>
  <text x="790" y="748" class="label-text">Trunk 20,30,40,99</text>

  <!-- Label: Redundant Trunk Fa0/23 (STP BLK) -->
  <rect x="400" y="775" width="240" height="26" class="label-pill-stp"/>
  <text x="520" y="788" class="label-text-stp">Redundant Trunk Fa0/23 (STP BLK)</text>


  <!-- ================= DEVICE NODES (ROUNDED BOXES) ================= -->
  <!-- 1. Internet Server -->
  <g id="Internet-Server">
    <rect x="465" y="25" width="220" height="65" class="node-box-server"/>
    <text x="575" y="52" class="title-text">Internet Server</text>
    <text x="575" y="73" class="subtitle-text">203.0.113.10</text>
  </g>

  <!-- 2. R-ISP Gateway -->
  <g id="R-ISP">
    <rect x="455" y="175" width="240" height="70" class="node-box"/>
    <text x="575" y="204" class="title-text">R-ISP Gateway</text>
    <text x="575" y="226" class="subtitle-text">NAT/PAT Overload</text>
  </g>

  <!-- 3. R-CAMPUS Core -->
  <g id="R-CAMPUS">
    <rect x="450" y="330" width="250" height="70" class="node-box"/>
    <text x="575" y="359" class="title-text">R-CAMPUS Core</text>
    <text x="575" y="381" class="subtitle-text">ROAS Gateway</text>
  </g>

  <!-- 4. R-HOSTEL -->
  <g id="R-HOSTEL">
    <rect x="95" y="500" width="250" height="70" class="node-box"/>
    <text x="220" y="529" class="title-text">R-HOSTEL</text>
    <text x="220" y="551" class="subtitle-text">Branch Router &amp; DHCP</text>
  </g>

  <!-- 5. SW-HOSTEL -->
  <g id="SW-HOSTEL">
    <rect x="95" y="675" width="250" height="65" class="node-box"/>
    <text x="220" y="703" class="title-text">SW-HOSTEL</text>
    <text x="220" y="724" class="subtitle-text">VLAN 50 &amp; 80</text>
  </g>

  <!-- 6. AP-HOSTEL -->
  <g id="AP-HOSTEL">
    <rect x="80" y="830" width="280" height="65" class="node-box"/>
    <text x="220" y="858" class="title-text">AP-HOSTEL</text>
    <text x="220" y="879" class="subtitle-text">SSID: CAMPUS-WIFI (Port 0)</text>
  </g>

  <!-- 7. SW-CORE (Root Primary) -->
  <g id="SW-CORE">
    <rect x="675" y="500" width="250" height="70" class="node-box-core"/>
    <text x="800" y="529" class="title-text">SW-CORE</text>
    <text x="800" y="551" class="subtitle-text">Rapid-PVST Root Bridge</text>
  </g>

  <!-- 8. SW-ADMIN -->
  <g id="SW-ADMIN">
    <rect x="395" y="675" width="250" height="65" class="node-box"/>
    <text x="520" y="703" class="title-text">SW-ADMIN</text>
    <text x="520" y="724" class="subtitle-text">Admin &amp; Security</text>
  </g>

  <!-- 9. SW-SERVER -->
  <g id="SW-SERVER">
    <rect x="855" y="675" width="250" height="65" class="node-box"/>
    <text x="980" y="703" class="title-text">SW-SERVER</text>
    <text x="980" y="724" class="subtitle-text">Web &amp; DNS Farm</text>
  </g>

  <!-- 10. SW-ACADEMIC -->
  <g id="SW-ACADEMIC">
    <rect x="590" y="830" width="280" height="65" class="node-box"/>
    <text x="730" y="858" class="title-text">SW-ACADEMIC</text>
    <text x="730" y="879" class="subtitle-text">CSE, IoT &amp; Library</text>
  </g>
</svg>
