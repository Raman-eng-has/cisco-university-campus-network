<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>University Network Topology - Dark Theme</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background-color: #0B0F17;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #E2E8F0;
    }
    h2 {
      margin-bottom: 8px;
    }
    p {
      color: #94A3B8;
      margin-top: 0;
      margin-bottom: 24px;
    }
    .diagram-container {
      max-width: 1100px;
      width: 100%;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <h2>University Network Topology Diagram</h2>
  <p>Dark Grey Rounded Rectangles with High-Contrast Text • Ready for PowerPoint &amp; Gamma AI</p>
  <div class="diagram-container">
    <object type="image/svg+xml" data="topology_diagram.svg" width="100%"></object>
  </div>
</body>
</html>
